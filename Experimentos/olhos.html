<!DOCTYPE html>
<html lang="PT-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORFEU - PROJETO OLHOS</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <div id="cofre">
    <div class="crt">
      <div class="terminal">
        <pre id="cofreAviso">
CLASSIFICAÇÃO: ULTRA-RESTRITA
AUTORIZAÇÃO: VERIFICANDO...
        </pre>

        <a href="experimento.html" class="return-link">&lt; RETORNAR AOS EXPERIMENTOS</a>
      </div>
    </div>
  </div>

  <script src="olhos-cifrado.js"></script>
  <script src="cofre.js"></script>
  <script>
    (function () {
      var guardada = null;
      try { guardada = sessionStorage.getItem("orfeu:olhos"); } catch (erro) {}
      var senha = guardada || prompt("AUTORIZAÇÃO NECESSÁRIA:");

      abrirOlhos(senha).then(function (conteudo) {
        if (conteudo) {
          // Conteúdo próprio do site, decifrado e autenticado pelo AES-GCM.
          document.getElementById("cofre").innerHTML = conteudo;
        } else {
          try { sessionStorage.removeItem("orfeu:olhos"); } catch (erro) {}
          document.getElementById("cofreAviso").textContent =
            "\nCLASSIFICAÇÃO: ULTRA-RESTRITA\nAUTORIZAÇÃO: NEGADA\n\nACESSO NEGADO.\n";
        }
      });
    })();
  </script>
</body>

</html>
